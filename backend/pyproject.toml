"app/services/market_data.py" = ["PLR0913", "C901"]
"app/services/research_artifacts.py" = ["C901"]
"app/services/scraper_beige_book.py" = ["C901"]
"app/services/scraper_press_conferences.py" = ["C901"]
"app/services/scraper_regional_research.py" = ["C901"]
"app/services/scraper_speeches.py" = ["C901"]
"app/services/scraper_testimonies.py" = ["C901"]
"app/services/sentiment.py" = ["C901"]
"app/services/text_encoder.py" = ["PLR0913"]
"app/train_forecaster.py" = ["PLR0913", "C901"]
"app/training/loaders.py" = ["PLR0913", "C901"]
"app/training/loop.py" = ["PLR0913", "C901"]
