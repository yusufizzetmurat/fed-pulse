[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fed-pulse-backend"
version = "0.1.0"
description = "FOMC-text short-horizon market forecaster, backend (FastAPI + PyTorch + Transformers)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Yusuf İzzet Murat" }]
license = { text = "Proprietary - Bogazici University SWE 599 thesis project" }

dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  # transformers 5.x removed `GenerationMixin` from
  # `transformers.models.auto.auto_factory`, which breaks the multi-axis
  # encoder loader (post_306 Runpod sweep, #409). Pin to the 4.57+ line
  # the encoder was last validated on; bump deliberately when 5.x is
  # vetted end-to-end.
  "transformers>=4.57,<5",
  "accelerate>=1.1.0",
  "sentence-transformers>=3.0",
  "huggingface_hub>=0.24",
  "torch",
  "python-multipart",
  "requests",
  "beautifulsoup4",
  "yfinance",
  "pandas",
  "pandera>=0.20",
  "pyarrow",
  # datasets 4.x removed APIs the loaders use (#465 / #409); pin <4 until
  # the loaders migrate to the new API surface.
  "datasets>=3.0,<4",
  "kagglehub",
  "anthropic>=0.40.0",
  "google-genai>=1.0.0",
  "langsmith>=0.1.0",
  "scikit-learn",
  "arch>=6.3",
  "peft>=0.10",
  "pypdf>=5.0.0",
  "pdfplumber>=0.11.0",
  "python-docx>=1.1.0",
  # pandas.read_excel(engine="openpyxl") consumes the Swanson 2021
  # three-factor xlsx mirror (#420). Pinned so the swanson_three_factor
  # adapter resolves cleanly in fresh container builds.
  "openpyxl>=3.1",
  "httpx>=0.27.0",
  "SQLAlchemy>=2.0",
  # SQLAlchemy 2.0 pulls greenlet on Linux CPython but the dep isn't
  # declared on macOS, so a lock generated on Mac omits it. Without an
  # explicit pin, pip on the pod resolves greenlet unpinned and the
  # --require-hashes install fails. Pin so the next lock regen catches it.
  "greenlet>=3.0",
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-asyncio",
  "hypothesis",
  "ruff",
  "mypy",
  "py-spy>=0.3.14",
  "types-PyYAML",
  "types-requests",
  "schemathesis>=3.30",
]
gpu = []

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "models", "*.pyc"]

# The production image and the dev-cpu stack are CPU-only. Since torch
# 2.12 the default Linux wheel on PyPI is the CUDA build, which declares
# `cuda-toolkit==13.0.x; platform_system == "Linux"` (plus the nvidia-*
# runtime stack) as a hard dependency. A lock generated on macOS never
# sees those Linux-only deps, so the hashed install on the Linux build
# host trips `--require-hashes` ("hashes are required ... cuda-toolkit").
# Force the `+cpu` build (no CUDA deps) from the PyTorch CPU index — the
# same wheel that runs in every CPU container (Docker runs Linux images
# on macOS too). `make lock` drives `uv pip compile`, which ignores
# [tool.uv.sources], so the override + index below are the levers that
# interface honors; `--emit-index-url` (in the Makefile) writes the CPU
# index into the lock so the hashed `pip install` can locate the wheel.
# Bump the override pin in lockstep when upgrading torch. The GPU stack
# stays in requirements-gpu-cu121.txt / `make dev-gpu`.
[tool.uv]
override-dependencies = ["torch==2.12.0+cpu"]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "B",
  "C4",
  "UP",
  # New in #95 hardening pass:
  "C901",    # cyclomatic complexity — flag deeply nested branches before review.
  "PLR0913", # too-many-arguments — push toward dataclass / config object.
  "TID252",  # banned relative imports — keep import paths absolute and greppable.
  "INP001",  # implicit namespace packages — flag dirs that lack __init__.py.
]
ignore = [
  "E402",   # module-level imports placed after sys.path manipulation in legacy CLI scripts
  "E501",   # line length
  "F401",   # unused imports — legacy __init__.py re-exports; cleanup in follow-up
  "F541",   # f-string without placeholders
  "F841",   # unused local variable
  "I001",   # import sorting — bulk reformat in follow-up
  "B008",   # function-call default in argument — FastAPI's Depends() pattern
  "B905",   # zip without strict=
  "UP012",  # explicit encoding="utf-8" — intentional clarity, kept
  "UP017",  # datetime.timezone.utc → datetime.UTC (Python 3.11 idiom; adopt in cleanup)
  "UP035",  # typing.* → collections.abc.* (Python 3.10 idiom; adopt in cleanup)
  "UP037",  # quoted annotations → built-in generics (Python 3.9 idiom; adopt in cleanup)
]

[tool.ruff.lint.per-file-ignores]
# Tests are intentionally not a package (no __init__.py) so pytest can
# autodiscover, and test fixtures naturally pile up positional arguments.
"tests/**/*.py" = ["C901", "PLR0913", "INP001"]
# Scripts are top-level entrypoints, not a package; CLI builders accept a
# fan-out of keyword arguments by design. Mirrors the root-level ruff.toml
# rule so root- and backend-rooted invocations agree.
"scripts/**/*.py" = ["C901", "PLR0913", "INP001"]
# Existing files that already exceed the C901 / PLR0913 thresholds. The
# rules are wired in to catch *new* violations during review; refactoring
# the entries below into per-file ignores is intentional — they map the
# current debt surface and a fresh PR is expected to leave the rule
# active wherever it does not yet appear here.
"app/audit.py" = ["PLR0913"]
"app/data/alphavantage_spx.py" = ["PLR0913"]
"app/data/attention_ablation.py" = ["PLR0913", "C901"]
"app/data/build_training_package.py" = ["PLR0913", "C901"]
