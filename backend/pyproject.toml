[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fed-pulse-backend"
version = "0.1.0"
description = "FOMC-text short-horizon market forecaster, backend (FastAPI + PyTorch + Transformers)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Yusuf İzzet Murat" }]
license = { text = "Proprietary - Bogazici University SWE 599 thesis project" }

dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "transformers",
  "accelerate>=1.1.0",
  "torch",
  "python-multipart",
  "requests",
  "beautifulsoup4",
  "yfinance",
  "pandas",
  "pandera>=0.20",
  "pyarrow",
  "datasets",
  "kagglehub",
  "google-genai>=1.0.0",
  "langsmith>=0.1.0",
  "scikit-learn",
  "pypdf>=5.0.0",
  "pdfplumber>=0.11.0",
  "python-docx>=1.1.0",
  "httpx>=0.27.0",
  "SQLAlchemy>=2.0",
  "structlog>=24.1",
  "arq>=0.26",
  "redis>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-asyncio",
  "hypothesis",
  "ruff",
  "mypy",
  "py-spy>=0.3.14",
  "types-PyYAML",
  "types-requests",
  "fakeredis>=2.20",
]
gpu = []

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "models", "*.pyc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "B",
  "C4",
  "UP",
  # New in #95 hardening pass:
  "C901",    # cyclomatic complexity — flag deeply nested branches before review.
  "PLR0913", # too-many-arguments — push toward dataclass / config object.
  "TID252",  # banned relative imports — keep import paths absolute and greppable.
  "INP001",  # implicit namespace packages — flag dirs that lack __init__.py.
]
ignore = [
  "E402",   # module-level imports placed after sys.path manipulation in legacy CLI scripts
  "E501",   # line length
  "F401",   # unused imports — legacy __init__.py re-exports; cleanup in follow-up
  "F541",   # f-string without placeholders
  "F841",   # unused local variable
  "I001",   # import sorting — bulk reformat in follow-up
  "B008",   # function-call default in argument — FastAPI's Depends() pattern
  "B905",   # zip without strict=
  "UP012",  # explicit encoding="utf-8" — intentional clarity, kept
  "UP017",  # datetime.timezone.utc → datetime.UTC (Python 3.11 idiom; adopt in cleanup)
  "UP035",  # typing.* → collections.abc.* (Python 3.10 idiom; adopt in cleanup)
  "UP037",  # quoted annotations → built-in generics (Python 3.9 idiom; adopt in cleanup)
]

[tool.ruff.lint.per-file-ignores]
# Tests are intentionally not a package (no __init__.py) so pytest can
# autodiscover, and test fixtures naturally pile up positional arguments.
"tests/**/*.py" = ["C901", "PLR0913", "INP001"]
# Existing files that already exceed the C901 / PLR0913 thresholds. The
# rules are wired in to catch *new* violations during review; refactoring
# the entries below into per-file ignores is intentional — they map the
# current debt surface and a fresh PR is expected to leave the rule
# active wherever it does not yet appear here.
"app/audit.py" = ["PLR0913"]
"app/data/attention_ablation.py" = ["PLR0913", "C901"]
