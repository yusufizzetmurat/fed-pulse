  finbert_fed_adjacent_xbank:
    repo: /data/artifacts/phase3/finetune_batch_20260519T190604Z/finbert_fed_adjacent_s11/hf_checkpoints
    revision: "20260519T190604Z_s11"
    gated: false
    task: stance_classification
    description: |
      Phase C (#228) cross-bank auxiliary-supervised variant of
      ``finbert_fed_adjacent``. Same MLM substrate; the supervised
      stance head trains with ``--cross-bank-supervision=on`` so the
      15k cross-bank rows (ECB / BoJ / BoE / BoC / RBA at
      ``provenance=peer_reviewed_cross_bank``) join the FOMC pool as
      full-weight training rows. Pinned to the s11 checkpoint from the
      2026-05-19 GPU run (macro-F1 0.672 mean across 5 seeds on the
      stance head); the remaining four seeds are kept on disk under
      ``finetune_batch_20260519T190604Z/finbert_fed_adjacent_s{29,47,71,97}``
      for reproducibility but the embedding cache builds against s11.

  finbert_fed_adjacent_xbank_dapt:
    repo: /data/artifacts/continued_pretraining/finbert_fed_adjacent_xbank_dapt_20260525T185524Z_s11/checkpoint
    revision: "20260525T185524Z_s11"
    gated: false
    task: masked_lm
    role: retrieval
    description: |
      DAPT substrate-extension sibling of ``finbert_fed_adjacent``. Same
      MLM+NSP recipe, but the pretraining substrate adds the 5 cross-bank
      gtfintechlab corpora (ECB / BoJ / BoE / BoC / RBA, ~15k sentences
      reformatted as ~7.5k consecutive NSP pairs) on top of the BIS
      speeches firehose — pure pretrain extension, no FOMC / local
      Fed-adjacent JSON, so the downstream fine-tune target is unchanged
      and there is no target leakage. Produced by
      ``make finbert-fed-adjacent-xbank-dapt-pretrain``. Revision stays
      empty until the first GPU run lands a checkpoint; same unpinned-
      local guard as ``finbert_fomc_only`` applies.

      Carries ``role: retrieval`` under ADR 0019 — the canonical
      retrieval substrate. Bundle A.2 / A.4 showed the cross-bank
      supervised + DAPT layers null on the headline classifier target,
      so this encoder owns the retrieval role only; the classifier role
      is held by ``finbert_fomc_only``.

  finbert_fed_adjacent_xbank_aux_stance_masked:
    repo: /data/artifacts/text_multi_axis/text_multi_axis_20260525T105459Z/hf_checkpoints
    revision: "20260525T105459Z"
    gated: false
    task: stance_classification
    description: |
      Bundle A.2 arm A: ``finbert_fed_adjacent`` fine-tuned through
      ``train_text_multi_axis_classifier.py --cross-bank-supervision
      stance_masked``. Cross-bank rows enter the loader and contribute
      gradient on the certainty / factor / topic axes, but every row
      with ``provenance=peer_reviewed_cross_bank`` carries
      ``mask_stance=False`` so the stance head only fits the FOMC stance
      distribution. The substitute-not-complement guard from Phase C
      (#231). Validation accuracy at the best epoch: stance 0.981 /
      certainty 0.984 (val_loss=0.0922). Pin holds the encoder backbone
      + tokenizer saved alongside the singleton inference checkpoint at
      ``backend/models/text_multi_axis_best.pt``.

  finbert_fed_adjacent_xbank_aux_weighted:
    repo: /data/artifacts/text_multi_axis/text_multi_axis_20260525T110428Z/hf_checkpoints
    revision: "20260525T110428Z"
    gated: false
    task: stance_classification
    description: |
      Bundle A.2 arm B: ``finbert_fed_adjacent`` fine-tuned through
      ``train_text_multi_axis_classifier.py --cross-bank-supervision
      weighted --cross-bank-stance-weight 0.25``. Cross-bank rows enter
      with their stance label intact but their per-row stance CE
      contribution is scaled by 0.25 so they regularise rather than
      dominate the FOMC stance distribution. The diagnostic A/B against
      ``finbert_fed_adjacent_xbank_aux_stance_masked`` that re-litigates
      the Phase C substitute-not-complement prior. Validation accuracy
      at the best epoch: stance 0.978 / certainty 0.984 (val_loss=0.0974).

  finbert_fed_adjacent_xbank_dapt_retrieval:
    repo: /data/artifacts/retrieval/finbert_fed_adjacent_xbank_dapt_retrieval/checkpoint
    revision: ""
    gated: false
    task: sentence_embedding
    description: |
      Sentence-transformer fine-tune (#294) layered on top of the
      ``finbert_fed_adjacent_xbank_dapt`` MLM checkpoint. Produced by
      ``python -m app.retrieval.train`` — contrastive
      MultipleNegativesRankingLoss over same-meeting positive pairs
      (statement / minutes / press_conference sharing an event_date in
      ``events.parquet``). Powers ``/analyze/analogs``: the historical
      FOMC-statement index lives at
      ``data/artifacts/retrieval/<run-id>/index.parquet`` and the
      encoder is mean-pooled over the document at query time. Revision
      stays empty until the first GPU run lands a pinned checkpoint;
      same unpinned-local guard as ``finbert_fomc_only`` applies.
      Deployability lane (#302) will mirror the checkpoint to HF Hub
      in a follow-up — this PR keeps the artefact local.

  trajectory_lstm:
    repo: /data/artifacts/trajectory/trajectory_lstm/model.pt
    revision: ""
    gated: false
    task: trajectory_classification
    description: |
      Sequence-of-meetings LSTM baseline (#296). Two layers, 64-dim
      hidden. Consumes the per-meeting embedding produced by the
      cross-bank DAPT encoder (``finbert_fed_adjacent_xbank_dapt``)
      concatenated with the #291 pre-meeting market block (trailing
      2y yield change in bps + z-scored VIX close + bias term).
      Predicts the next meeting's stance (3-class hawkish / dovish /
      neutral). Produced by ``python -m app.trajectory.train
      --architecture lstm``; revision stays empty until the first
      GPU run lands a pinned checkpoint.

  trajectory_transformer:
    repo: /data/artifacts/trajectory/trajectory_transformer/model.pt
    revision: ""
    gated: false
    task: trajectory_classification
    description: |
      Sequence-of-meetings Transformer arm (#296). Encoder-only, four
      layers, 64-dim model, four attention heads, learned positional
      embeddings. Same input contract as ``trajectory_lstm``; the
      architecture A/B is the methodological point of the trajectory
      panel per §3 Panel 4 of the finalization roadmap. Produced by
      ``python -m app.trajectory.train --architecture transformer``;
      revision stays empty until the first GPU run lands a pinned
      checkpoint.

# HF Hub mirror of every artefact the inference container needs to boot.
# Local paths in ``encoders:`` above stay primary (the dev stack keeps
# reading them from the ``/data/`` mount); the URIs below are the
# fallback path the production droplet pulls via
# ``huggingface_hub.snapshot_download``. ``parse_hf_uri`` and
# ``resolve_hf_uri`` in ``app.models.registry`` consume these. Revisions
# stay empty until the operator runs ``python scripts/push_artefacts_to_hub.py``
# once and pins the resulting commit shas here.
artefacts:
  encoder_canonical:
    hf_uri: hf://yusufizzetmurat/finbert-fed-adjacent-xbank-dapt
    revision: "50677e3a0a84e2ce66089c902de2a5438c13d28e"
    eager: true
    description: |
      Canonical hot-path encoder — cross-bank DAPT-extended FinBERT
      substrate. Boot-time eager pull on the droplet entrypoint.

