    description: |
      FinBERT continued-pretrained on BIS speeches (+ optional local Fed-adjacent
      auxiliary). Produced by ``make finbert-fed-adjacent-pretrain``; pinned to
      the 2026-05-15 GPU run whose embedding cache lives at
      ``data/raw/embeddings/finbert_fed_adjacent_20260515T104.parquet``. The
      bake-off CLI now treats this encoder as runnable; cross-bank-supervised
      variants ride under ``finbert_fed_adjacent_xbank``.

  bert_base_fed_adjacent:
    repo: local/bert-base-fed-adjacent
    revision: ""
    gated: false
    task: masked_lm
    description: |
      Control ablation for finbert_fed_adjacent — same BIS+local continued-
      pretrain recipe applied on top of bert-base-uncased instead of ProsusAI/
      finbert. Run via ``make finbert-fed-adjacent-pretrain-bert-control``; the
      bake-off pairs the two checkpoints so we can isolate the contribution of
      the FinBERT prior versus the BIS substrate alone.

  finbert_fomc_only:
    repo: local/finbert-fomc-only
    revision: ""
    gated: false
    task: masked_lm
    description: |
      Round 3 (#242) corpus-ablation sibling of ``finbert_fed_adjacent``.
      Continued-pretrained on FOMC statements + minutes ONLY (~48 docs,
      ~240k tokens), bypassing BIS speeches and the broader Fed-adjacent
      JSON corpus. Produced by ``make finbert-fomc-only-pretrain``. The
      revision stays empty until the first GPU run lands a checkpoint;
      ``encoder_ref`` treats this as "unpinned local" and the bake-off
      CLI will refuse to load it until the path + revision are filled in.

  finbert_bis_only:
    repo: local/finbert-bis-only
    revision: ""
    gated: false
    task: masked_lm
    description: |
      Round 3 (#242) corpus-ablation sibling of ``finbert_fed_adjacent``.
      Continued-pretrained on samchain/BIS_speeches_97_23_MLM ONLY,
      dropping the legacy local Fed-adjacent auxiliary JSONs. Produced
      by ``make finbert-bis-only-pretrain``. Revision empty until the
      first GPU run lands a checkpoint; same unpinned-local guard as
      ``finbert_fomc_only`` applies.

  finbert_fed_adjacent_xbank:
    repo: /data/artifacts/phase3/finetune_batch_20260519T190604Z/finbert_fed_adjacent_s11/hf_checkpoints
    revision: "20260519T190604Z_s11"
    gated: false
    task: stance_classification
    description: |
      Phase C (#228) cross-bank auxiliary-supervised variant of
      ``finbert_fed_adjacent``. Same MLM substrate; the supervised
      stance head trains with ``--cross-bank-supervision=on`` so the
      15k cross-bank rows (ECB / BoJ / BoE / BoC / RBA at
      ``provenance=peer_reviewed_cross_bank``) join the FOMC pool as
      full-weight training rows. Pinned to the s11 checkpoint from the
      2026-05-19 GPU run (macro-F1 0.672 mean across 5 seeds on the
      stance head); the remaining four seeds are kept on disk under
      ``finetune_batch_20260519T190604Z/finbert_fed_adjacent_s{29,47,71,97}``
      for reproducibility but the embedding cache builds against s11.

  finbert_fed_adjacent_xbank_dapt:
    repo: /data/artifacts/continued_pretraining/finbert_fed_adjacent_xbank_dapt_20260525T185524Z_s11/checkpoint
    revision: "20260525T185524Z_s11"
    gated: false
    task: masked_lm
    description: |
      DAPT substrate-extension sibling of ``finbert_fed_adjacent``. Same
      MLM+NSP recipe, but the pretraining substrate adds the 5 cross-bank
      gtfintechlab corpora (ECB / BoJ / BoE / BoC / RBA, ~15k sentences
      reformatted as ~7.5k consecutive NSP pairs) on top of the BIS
      speeches firehose — pure pretrain extension, no FOMC / local
      Fed-adjacent JSON, so the downstream fine-tune target is unchanged
      and there is no target leakage. Produced by
      ``make finbert-fed-adjacent-xbank-dapt-pretrain``. Revision stays
      empty until the first GPU run lands a checkpoint; same unpinned-
      local guard as ``finbert_fomc_only`` applies.

  finbert_fed_adjacent_xbank_aux_stance_masked:
    repo: /data/artifacts/text_multi_axis/text_multi_axis_20260525T105459Z/hf_checkpoints
    revision: "20260525T105459Z"
    gated: false
    task: stance_classification
    description: |
      Bundle A.2 arm A: ``finbert_fed_adjacent`` fine-tuned through
      ``train_text_multi_axis_classifier.py --cross-bank-supervision
      stance_masked``. Cross-bank rows enter the loader and contribute
      gradient on the certainty / factor / topic axes, but every row
      with ``provenance=peer_reviewed_cross_bank`` carries
      ``mask_stance=False`` so the stance head only fits the FOMC stance
      distribution. The substitute-not-complement guard from Phase C
      (#231). Validation accuracy at the best epoch: stance 0.981 /
      certainty 0.984 (val_loss=0.0922). Pin holds the encoder backbone
      + tokenizer saved alongside the singleton inference checkpoint at
      ``backend/models/text_multi_axis_best.pt``.

  finbert_fed_adjacent_xbank_aux_weighted:
    repo: /data/artifacts/text_multi_axis/text_multi_axis_20260525T110428Z/hf_checkpoints
    revision: "20260525T110428Z"
    gated: false
    task: stance_classification
    description: |
      Bundle A.2 arm B: ``finbert_fed_adjacent`` fine-tuned through
      ``train_text_multi_axis_classifier.py --cross-bank-supervision
      weighted --cross-bank-stance-weight 0.25``. Cross-bank rows enter
      with their stance label intact but their per-row stance CE
      contribution is scaled by 0.25 so they regularise rather than
      dominate the FOMC stance distribution. The diagnostic A/B against
      ``finbert_fed_adjacent_xbank_aux_stance_masked`` that re-litigates
      the Phase C substitute-not-complement prior. Validation accuracy
      at the best epoch: stance 0.978 / certainty 0.984 (val_loss=0.0974).
