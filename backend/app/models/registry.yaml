  voyage_finance_2:
    repo: voyageai/voyage-finance-2
    revision: voyage-finance-2
    gated: true
    task: sentence_embedding
    api_only: true
    hidden_size: 1024
    description: |
      Voyage AI voyage-finance-2 sentence-embedding encoder (1024-dim,
      finance-tuned). Served by Voyage's hosted REST API, not the
      Hugging Face hub, so the cache builder lives at
      ``scripts/cache_voyage_embeddings.py`` rather than going through
      ``app.data.embedding_cache``. ``VOYAGE_API_KEY`` must be set;
      Voyage does not publish a checkpoint sha, so the revision field
      pins the model name itself. ``api_only: true`` tells every code
      path that would otherwise call ``AutoConfig.from_pretrained``
      / ``AutoModel.from_pretrained`` against ``ref.repo`` to read the
      cached embeddings off disk instead (the from_pretrained call
      would 404 against the API-only repo); ``hidden_size: 1024``
      surfaces the encoder's native pooled-vector dim without needing
      to instantiate the model.
    inference_features: []

  finbert_fed_adjacent:
    repo: yusufizzetmurat/finbert-fed-adjacent
    revision: "332e31e166e859deba81535bfeec410b3c6e7023"
    gated: false
    task: masked_lm
    role: classifier
    description: |
      FinBERT continued-pretrained on BIS speeches (+ optional local Fed-adjacent
      auxiliary). Produced by ``make finbert-fed-adjacent-pretrain``; pinned to
      the 2026-05-15 GPU run whose embedding cache lives at
      ``data/raw/embeddings/finbert_fed_adjacent_20260515T104.parquet``. The
      Hugging Face mirror (``yusufizzetmurat/finbert-fed-adjacent``) is the
      canonical source so a fresh machine resolves weights through
      ``snapshot_download`` instead of a host-specific ``/data/`` path that
      only exists on the original GPU box. Bake-off CLI treats this encoder
      as runnable; cross-bank-supervised variants ride under
      ``finbert_fed_adjacent_xbank``.

      Carries ``role: classifier`` per ADR 0019 — re-pointed from the
      unproduced ``finbert_fomc_only`` substrate (the FOMC-only DAPT GPU run
      was never executed and the placeholder blocked every classifier-role
      sweep on Runpod). The cross-bank DAPT encoder retains ``role: retrieval``.
    inference_features:
      - text_embedding
      - text_embedding_missing

  bert_base_fed_adjacent:
    repo: local/bert-base-fed-adjacent
    revision: ""
    gated: false
    task: masked_lm
    description: |
      Control ablation for finbert_fed_adjacent — same BIS+local continued-
      pretrain recipe applied on top of bert-base-uncased instead of ProsusAI/
      finbert. Run via ``make finbert-fed-adjacent-pretrain-bert-control``; the
      bake-off pairs the two checkpoints so we can isolate the contribution of
      the FinBERT prior versus the BIS substrate alone.
    inference_features:
      - text_embedding
      - text_embedding_missing

  finbert_fomc_only:
    repo: local/finbert-fomc-only
    revision: ""
    gated: false
    task: masked_lm
    description: |
      Round 3 (#242) corpus-ablation sibling of ``finbert_fed_adjacent``.
      Continued-pretrained on FOMC statements + minutes ONLY (~48 docs,
      ~240k tokens), bypassing BIS speeches and the broader Fed-adjacent
      JSON corpus. Produced by ``make finbert-fomc-only-pretrain``. The
      revision stays empty until the first GPU run lands a checkpoint;
      ``encoder_ref`` treats this as "unpinned local" and the bake-off
      CLI will refuse to load it until the path + revision are filled in.

      Originally tagged ``role: classifier`` per ADR 0019. The classifier
      role was re-pointed to ``finbert_fed_adjacent`` because the FOMC-only
      DAPT GPU run was never executed and the unresolvable placeholder hard-
      failed every classifier-role sweep on Runpod (#463). Re-tag this entry
      once the corpus-ablation pretrain lands a real checkpoint.
    inference_features:
      - text_embedding
      - text_embedding_missing

  finbert_bis_only:
    repo: local/finbert-bis-only
    revision: ""
    gated: false
    task: masked_lm
    description: |
      Round 3 (#242) corpus-ablation sibling of ``finbert_fed_adjacent``.
      Continued-pretrained on samchain/BIS_speeches_97_23_MLM ONLY,
      dropping the legacy local Fed-adjacent auxiliary JSONs. Produced
      by ``make finbert-bis-only-pretrain``. Revision empty until the
      first GPU run lands a checkpoint; same unpinned-local guard as
