  voyage_finance_2:
    repo: voyageai/voyage-finance-2
    revision: voyage-finance-2
    gated: true
    task: sentence_embedding
    description: |
      Voyage AI voyage-finance-2 sentence-embedding encoder (1024-dim,
      finance-tuned). Served by Voyage's hosted REST API, not the
      Hugging Face hub, so the cache builder lives at
      ``scripts/cache_voyage_embeddings.py`` rather than going through
      ``app.data.embedding_cache``. ``VOYAGE_API_KEY`` must be set;
      Voyage does not publish a checkpoint sha, so the revision field
      pins the model name itself.

  finbert_fed_adjacent:
    repo: local/finbert-fed-adjacent
    revision: ""
    gated: false
    task: masked_lm
    description: |
      FinBERT continued-pretrained on BIS speeches (+ optional local Fed-adjacent
      auxiliary). Produced by ``make finbert-fed-adjacent-pretrain``; the
      ``revision`` is filled in with the local checkpoint directory or its sha256
      after the GPU run completes. Empty revision means "not yet trained" — the
      bake-off CLI skips this encoder until a revision is pinned.

  bert_base_fed_adjacent:
    repo: local/bert-base-fed-adjacent
    revision: ""
    gated: false
    task: masked_lm
    description: |
      Control ablation for finbert_fed_adjacent — same BIS+local continued-
      pretrain recipe applied on top of bert-base-uncased instead of ProsusAI/
      finbert. Run via ``make finbert-fed-adjacent-pretrain-bert-control``; the
      bake-off pairs the two checkpoints so we can isolate the contribution of
      the FinBERT prior versus the BIS substrate alone.
