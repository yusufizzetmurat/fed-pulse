services:
  redis:
    image: redis:7-alpine
    container_name: swe599-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swe599-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./tests:/app/tests:ro
      - ./scripts:/app/scripts:ro
      - ./configs:/app/configs:ro
      - ./data:/data
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  backend-gpu:
    profiles: ["gpu"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swe599-backend-gpu
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./tests:/app/tests:ro
      - ./scripts:/app/scripts:ro
      - ./configs:/app/configs:ro
      - ./data:/data
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swe599-worker
    volumes:
      - ./backend:/app
      - ./tests:/app/tests:ro
      - ./scripts:/app/scripts:ro
      - ./configs:/app/configs:ro
      - ./data:/data
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    command: arq app.worker.WorkerSettings

  worker-gpu:
    profiles: ["gpu"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swe599-worker-gpu
    volumes:
      - ./backend:/app
      - ./tests:/app/tests:ro
      - ./scripts:/app/scripts:ro
      - ./configs:/app/configs:ro
      - ./data:/data
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: arq app.worker.WorkerSettings

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swe599-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./data:/data
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev
