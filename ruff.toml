# Root-level ruff config so `cd /wt && ruff check backend/app/ tests/unit/`
# can pick the same rules up for both subtrees. The backend tree has its
# own pyproject.toml (kept authoritative for backend-only invocations);
# this file mirrors the lint surface for the root-level invocation and
# adds the tests/** opt-out at a path that the root resolver actually
# sees.

line-length = 100
target-version = "py311"

[lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "B",
  "C4",
  "UP",
  "C901",
  "PLR0913",
  "TID252",
  "INP001",
]
ignore = [
  "E402",
  "E501",
  "F401",
  "F541",
  "F841",
  "I001",
  "B008",
  "B905",
  "UP012",
  "UP017",
  "UP035",
  "UP037",
]

[lint.per-file-ignores]
# Tests are intentionally not a package (no __init__.py) and test
# fixtures naturally pile up positional arguments.
"tests/**/*.py" = ["C901", "PLR0913", "INP001"]
# Scripts are top-level entrypoints, not a package; CLI builders accept a
# fan-out of keyword arguments by design.
"scripts/**/*.py" = ["C901", "PLR0913", "INP001"]
# Backend-side debt is keyed in backend/pyproject.toml; root invocations
# delegate to it implicitly by ignoring the same rules on backend paths.
"backend/app/audit.py" = ["PLR0913"]
