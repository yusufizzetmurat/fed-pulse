name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install ruff
        run: python -m pip install --upgrade pip ruff==0.5.0
      - name: ruff check
        run: ruff check backend
      - name: ruff format check
        run: ruff format --check backend

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install backend with dev extras
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: mypy on services and schemas
        working-directory: backend
        run: mypy --ignore-missing-imports --no-strict-optional app/services app/schemas.py app/config.py app/determinism.py

  pytest:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install backend with dev extras
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: pytest unit + property + contract + regression
        env:
          PYTHONPATH: backend
        run: |
          pytest tests/unit tests/properties tests/contract tests/regression -q --maxfail=5

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install pre-commit
        run: python -m pip install --upgrade pip pre-commit
      - name: run hooks
        run: pre-commit run --all-files --show-diff-on-failure
