name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: install ruff
        run: python -m pip install --upgrade pip ruff==0.5.0
      - name: ruff check
        run: ruff check backend
      # ruff format --check disabled until the dedicated ruff-cleanup PR
      # runs `ruff format` once over the legacy codebase and commits the diff.
      # Pre-commit still enforces format on new commits via the ruff-format hook.

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: install backend with dev extras
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: mypy --strict on typed modules
        working-directory: backend
        run: |
          mypy --strict --ignore-missing-imports \
            --follow-imports=silent \
            app/config.py app/determinism.py app/schemas.py \
            app/data/sources app/data/label_schemas.py \
            app/training app/models app/services app/evaluation

  pytest:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: install backend with dev extras
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: pytest unit + property + contract + regression
        env:
          PYTHONPATH: backend
        run: |
          pytest tests/unit tests/properties tests/contract tests/regression \
            -q --maxfail=5 \
            --cov=app --cov-report=term --cov-fail-under=65

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install frontend deps
        run: npm ci
      - name: type-check
        run: npm run type-check
      - name: vitest
        run: npm test
      - name: next build
        run: npm run build

  # pre-commit (all-files) is disabled in CI until the dedicated ruff-cleanup
  # PR runs `ruff format` once over the legacy codebase, fixes the EOF /
  # trailing-whitespace findings on the pre-existing modules, and commits the
  # diff. The hooks still run locally on every commit via `pre-commit install`.

  vuln-python:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: install pip-audit and backend deps (skipping the local package)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pip-audit==2.7.3
          # Audit third-party deps only. `fed-pulse-backend` is not on PyPI,
          # so `pip-audit --strict` would otherwise treat the local install
          # as "could not audit" and fail the job.
          python - <<'PY' > /tmp/audit-reqs.txt
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              data = tomllib.load(fh)
          for spec in data["project"]["dependencies"]:
              print(spec)
          PY
          pip install -r /tmp/audit-reqs.txt
      - name: pip-audit
        run: pip-audit --strict --ignore-vuln GHSA-q34m-jh98-gwm2

  vuln-npm:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install frontend deps
        run: npm ci
      - name: npm audit
        # High-severity Next.js DoS advisories require the Next 16 migration
        # (tracked separately). Audit still surfaces them in the build log
        # while CI only fails on critical findings.
        run: npm audit --audit-level=critical --omit=dev
