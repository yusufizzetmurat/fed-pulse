name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: install ruff
        run: python -m pip install --upgrade pip ruff==0.5.0
      - name: ruff check
        run: ruff check backend
      - name: ruff format --check
        run: ruff format --check backend

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: install backend with dev extras
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: mypy --strict on typed modules
        working-directory: backend
        run: |
          mypy --strict --ignore-missing-imports \
            --follow-imports=silent \
            app/config.py app/determinism.py app/schemas.py \
            app/data/sources app/data/label_schemas.py \
            app/training app/models app/services app/evaluation app/eval

  pytest:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: install backend with dev extras
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: pytest unit + property + contract + regression
        env:
          PYTHONPATH: backend
          # Authenticated HF requests get a much higher rate-limit than
          # the per-IP anonymous quota. Without this the burstier days
          # of CI traffic hit 429s on the model-download path inside
          # tests/unit/test_har_tercile_backtest.py and friends.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pytest tests/unit tests/properties tests/contract tests/regression \
            -q --maxfail=5 \
            --cov=app --cov-report=term --cov-fail-under=65

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install frontend deps
        run: npm ci
      - name: type-check
        run: npm run type-check
      - name: vitest
        run: npm test
      - name: next build
        run: npm run build

  # pre-commit (all-files) is disabled in CI until the dedicated ruff-cleanup
  # PR runs `ruff format` once over the legacy codebase, fixes the EOF /
  # trailing-whitespace findings on the pre-existing modules, and commits the
  # diff. The hooks still run locally on every commit via `pre-commit install`.

  vuln-python:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: install pip-audit and backend deps (skipping the local package)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pip-audit==2.7.3
          # Audit third-party deps only. `fed-pulse-backend` is not on PyPI,
          # so `pip-audit --strict` would otherwise treat the local install
          # as "could not audit" and fail the job.
          python - <<'PY' > /tmp/audit-reqs.txt
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              data = tomllib.load(fh)
          for spec in data["project"]["dependencies"]:
              print(spec)
          PY
          pip install -r /tmp/audit-reqs.txt
      - name: pip-audit
        # GHSA-q34m-jh98-gwm2: tracked upstream; no fix shipped yet, low
        #   exploitability against our usage (TODO: revisit once upstream
        #   publishes a fix release).
        # MAL-2026-4750: malicious-package advisory against fastapi 0.136.3
        #   with no documented fix version. Tracks an upstream PyPI naming
        #   collision, not the project's resolved fastapi install (which
        #   comes from the official PyPI publisher); ignored until the
        #   advisory is withdrawn or a clean fix lands.
        # PYSEC-2025-217: torch-side advisory whose resolved fix would
        #   force a CUDA-major upgrade across the training stack
        #   (TODO: bundle with the next torch upgrade window).
        # GHSA-69w3-r845-3855: transitive advisory with no callable code
        #   path in our usage (TODO: drop once the upstream cuts a
        #   patched release).
        run: pip-audit --strict --ignore-vuln GHSA-q34m-jh98-gwm2 --ignore-vuln MAL-2026-4750 --ignore-vuln PYSEC-2025-217 --ignore-vuln GHSA-69w3-r845-3855

  vuln-npm:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install frontend deps
        run: npm ci
      - name: npm audit
        # High-severity Next.js DoS advisories require the Next 16 migration
        # (tracked separately). Audit still surfaces them in the build log
        # while CI only fails on critical findings.
        run: npm audit --audit-level=critical --omit=dev
