name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install ruff
        run: python -m pip install --upgrade pip ruff==0.5.0
      - name: ruff check
        run: ruff check backend
      # ruff format --check disabled until the dedicated ruff-cleanup PR
      # runs `ruff format` once over the legacy codebase and commits the diff.
      # Pre-commit still enforces format on new commits via the ruff-format hook.

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install backend with dev extras
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: mypy on strictly-typed modules
        working-directory: backend
        run: |
          mypy --ignore-missing-imports --no-strict-optional \
            --follow-imports=silent \
            app/config.py app/determinism.py app/schemas.py \
            app/data/sources app/data/label_schemas.py \
            app/training app/models

  pytest:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install backend with dev extras
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: pytest unit + property + contract + regression
        env:
          PYTHONPATH: backend
        run: |
          pytest tests/unit tests/properties tests/contract tests/regression -q --maxfail=5

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install frontend deps
        run: npm ci
      - name: type-check
        run: npm run type-check
      - name: vitest
        run: npm test
      - name: next build
        run: npm run build

  # pre-commit (all-files) is disabled in CI until the dedicated ruff-cleanup
  # PR runs `ruff format` once over the legacy codebase, fixes the EOF /
  # trailing-whitespace findings on the pre-existing modules, and commits the
  # diff. The hooks still run locally on every commit via `pre-commit install`.
