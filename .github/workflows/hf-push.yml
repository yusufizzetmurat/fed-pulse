name: hf-push

# Manual push of canonical artefacts to Hugging Face Hub.
#
# Runs server-side via GH Actions ("Run workflow" button on this
# workflow) so HF_TOKEN_WRITE only ever lives in the GH secret store,
# never on the operator's laptop. The operator can dry-run first to
# inspect the plan before flipping --all on. After a successful push,
# paste the printed commit shas into ``backend/app/models/registry.yaml``
# under the matching ``artefacts.<key>.revision`` field.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Print what would be pushed without uploading"
        type: boolean
        default: false
      repos:
        description: "Comma-separated kinds to push (encoder,forecaster,...); empty = all"
        type: string
        default: ""

concurrency:
  group: hf-push-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: install huggingface_hub
        run: pip install --upgrade "huggingface_hub>=0.24" "pyyaml>=6.0"
      - name: push artefacts
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_WRITE }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ "${{ inputs.dry-run }}" = "true" ]; then
              ARGS="${ARGS} --dry-run"
          fi
          if [ -n "${{ inputs.repos }}" ]; then
              ARGS="${ARGS} --kinds ${{ inputs.repos }}"
          else
              ARGS="${ARGS} --all"
          fi
          python scripts/push_artefacts_to_hub.py --owner yusufizzetmurat ${ARGS}
