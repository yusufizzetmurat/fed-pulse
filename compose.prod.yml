# Production compose stack for the fed-pulse DigitalOcean droplet.
#
# Three services:
#   backend   : FastAPI (uvicorn, 2 workers) on internal :8000
#   frontend  : Next.js standalone server on internal :3000
#   caddy     : reverse proxy + Let's Encrypt on host :80 / :443
#
# The backend and frontend share the same image (Dockerfile.prod
# multi-stage build); each container runs its own entrypoint by
# overriding the s6 service mask via FED_PULSE_SVC_MASK so the
# supervisor only starts the matching process. Keeping one image
# halves the bandwidth on every deploy and matches the per-droplet
# hot-path model where both processes hold their own warm HF cache
# slice. The hf-cache named volume is mounted on both services so the
# 2-4 GB encoder bundles survive ``docker compose up --build``.

services:
  backend:
    image: fed-pulse:prod
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: https://fedpulse.yusufizzetmurat.com
    container_name: fed-pulse-backend
    restart: always
    env_file:
      - /etc/fed-pulse/.env
    environment:
      - PYTHONUNBUFFERED=1
      - FED_PULSE_SVC_MASK=backend
      - HF_HOME=/home/fedpulse/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/home/fedpulse/.cache/huggingface
    volumes:
      - /etc/fed-pulse/data:/data
      - hf-cache:/home/fedpulse/.cache/huggingface
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  frontend:
    image: fed-pulse:prod
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: https://fedpulse.yusufizzetmurat.com
    container_name: fed-pulse-frontend
    restart: always
    # The FE entrypoint never touches HF Hub (FED_PULSE_SKIP_EAGER_PULL=1)
    # so HF_TOKEN is not required, but threading the env file keeps the
    # config surface symmetrical between services and lets a future
    # FE-side artefact pull authenticate without re-plumbing secrets.
    env_file:
      - /etc/fed-pulse/.env
    environment:
      - NODE_ENV=production
      - FED_PULSE_SVC_MASK=frontend
      - FED_PULSE_SKIP_EAGER_PULL=1
      - NEXT_PUBLIC_API_URL=https://fedpulse.yusufizzetmurat.com
      - HF_HOME=/home/fedpulse/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/home/fedpulse/.cache/huggingface
    volumes:
      - hf-cache:/home/fedpulse/.cache/huggingface
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2
    container_name: fed-pulse-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  caddy_data:
  caddy_config:
  # Persists ~/.cache/huggingface between image rebuilds so the droplet
  # does not re-pull 2-4 GB of encoder weights on every deploy. Owned by
  # UID 10001 (the ``fedpulse`` user) inside the container.
  hf-cache:
